[project]
name = "didwebs"
version = "0.0.0"
description = "Publish did:webs DIDs for KERI-controlled AIDs — verified artifacts from a CESR stream, never passthrough."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo" }]
dependencies = [
    # The estate pin (this.i decisions gvimca/qbqfst). Public repo, plain HTTPS: anonymous
    # resolution needs no credential, in a fresh clone or in CI.
    #
    # 6f95d314 is sedi-substrate-v3, the commit heti pins (decision 66g4hfd2). It replaced
    # 366d810 on 2026-10-06 with the v1 wire format unchanged: assemble builds the ACDC's v1
    # source-seal triple itself because keripy's signing.serialize no longer can. The estate
    # need not hold one commit in common (gvimca); witness pins its own fork-only commit.
    # Any future bump must re-run the cross-implementation oracle (tests/crossimpl), which is
    # the only thing that checks the interop half of gvimca.
    "keri @ git+https://github.com/bakobo/keripy@6f95d31487874a3c426ea06d470c268bf5997561",
    # The shared ErrorCode/BakoboError machinery didwebs/errors.py is built on. Public repo,
    # plain HTTPS for the same reason as keri above.
    "bakobo-errors @ git+https://github.com/bakobo/errors@45f42ae4259cce144fe1d668c9c176d869c3023a",
    "rfc3986>=2.0.0",
]

[project.scripts]
didwebs = "didwebs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# didwebs pins keri and bakobo-errors to git commits; hatchling needs this to allow the direct
# references.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/didwebs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=didwebs --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["didwebs"]
