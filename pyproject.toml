[project]
name = "didwebs"
version = "0.0.0"
description = "Publish did:webs DIDs for KERI-controlled AIDs — verified artifacts from a CESR stream, never passthrough."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo" }]
dependencies = [
    # The estate pin (this.i decisions gvimca/qbqfst). Public repo, plain HTTPS: anonymous
    # resolution needs no credential, in a fresh clone or in CI.
    #
    # The estate does NOT hold one commit in common, and gvimca permits that ("possibly two
    # keripy versions across bakobo repos, with the mismatch documented rather than hidden").
    # As of 2026-08-28: witness pins this same commit; heti pins f663ecd, which is NOT on
    # `stack` or `main` but on `feat/keyalg-on-stack`. We deliberately do not follow heti onto
    # an unmerged feature branch — didwebs is Ed25519-only (decision 3woefn), so that work is
    # dead weight here.
    #
    # Bumping to `bakobo/stack` head (03f7d2d3) was ATTEMPTED 2026-08-28 and reverted: it breaks
    # the qbqfst pin and changes our published wire format. See tick ~3vol for the diagnosis.
    # Any future bump must re-run the cross-implementation oracle (tests/crossimpl), which is
    # the only thing that checks the interop half of gvimca.
    "keri @ git+https://github.com/bakobo/keripy@366d81071aea7be5b8ad35acbed815e1255224d5",
    # The shared ErrorCode/BakoboError machinery didwebs/errors.py is built on. Public repo,
    # plain HTTPS for the same reason as keri above.
    "bakobo-errors @ git+https://github.com/bakobo/errors@45f42ae4259cce144fe1d668c9c176d869c3023a",
    "rfc3986>=2.0.0",
]

[project.scripts]
didwebs = "didwebs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# didwebs pins keri and bakobo-errors to git commits; hatchling needs this to allow the direct
# references.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/didwebs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=didwebs --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["didwebs"]
