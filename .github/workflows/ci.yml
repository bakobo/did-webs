name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Both didwebs dependencies (keri, bakobo-errors) are public repos, resolved anonymously
      # over HTTPS — unlike bakobo/witness, no App-token minting or SSH-to-HTTPS rewrite step
      # is needed here.
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Run tests (100% branch coverage gate)
        run: uv run pytest
