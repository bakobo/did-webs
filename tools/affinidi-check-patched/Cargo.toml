[package]
name = "didwebs-affinidi-check-patched"
version = "0.1.0"
edition = "2024"

[dependencies]
affinidi-did-webs = "=0.7.0"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# Affinidi's two KERI crates, replaced by the public bakobo/affinidi-keri-rs fork at a commit on
# its sedi-demo-patches branch: it parses v1 -I source seals and accepts a v1 rotation without c.
# Both crates come from one revision, so their types stay identical.
[patch.crates-io]
affinidi-keri-core = { git = "https://github.com/bakobo/affinidi-keri-rs", rev = "1288096b1552713e552ca42a40fa6ce6d8fdadb6" }
affinidi-keri-crypto = { git = "https://github.com/bakobo/affinidi-keri-rs", rev = "1288096b1552713e552ca42a40fa6ce6d8fdadb6" }

[profile.dev]
debug = 0
